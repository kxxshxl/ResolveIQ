apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: resolveiq
resources: [namespace.yaml, configmap.yaml, backend.yaml, worker.yaml, frontend.yaml, ingress.yaml, networkpolicy.yaml]
# Release order (the migrate Job reads the ConfigMap and Secret, and the API must not start on an empty schema or an unseeded taxonomy):
#   kubectl apply -f namespace.yaml ; create resolveiq-secrets (see secret.example.yaml)
#   kubectl apply -f configmap.yaml
#   kubectl apply -f migrate-job.yaml ; kubectl -n resolveiq wait --for=condition=complete job/resolveiq-migrate --timeout=10m
#   kubectl apply -k .
# The image must contain the seed data at DATA_DIR (/app/data); k8s/local/Dockerfile shows how. Local cluster: ../local (see docs/kubernetes.md).
