global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: resolveiq-backend
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    # one target per backend replica (Docker DNS returns every task IP)
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: resolveiq-worker
    metrics_path: /metrics        # internal network only; the worker exposes no other endpoint
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s
