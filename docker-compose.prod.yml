# Production single-host deployment (Docker Engine + Compose v2).
#   python deploy/gen_secrets.py --domain support.example.com     # writes .env.prod + secrets/ (never committed)
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Only the TLS proxy publishes ports. Postgres, Redis, backend, frontend and Prometheus are internal-only.
# For multi-node / HA use the Kubernetes manifests in k8s/ with managed Postgres + Redis.
name: resolveiq-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
  DATABASE_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CACHE_NAMESPACE: prod
  API_KEYS: ${API_KEYS}
  METRICS_TOKEN: ${METRICS_TOKEN}
  CORS_ORIGINS: https://${SITE_ADDRESS}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-60}
  LLM_PROVIDERS: ${LLM_PROVIDERS:-ollama}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
  OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
  OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
  OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
  JOB_EXECUTION: queue
  DISCOVERY_SCHEDULE_HOURS: ${DISCOVERY_SCHEDULE_HOURS:-24}
  DATA_DIR: /app/data

services:
  db:
    <<: *hardening
    cap_drop: []            # postgres needs its default capabilities to switch user / chown its data dir
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-512MB}", "-c", "log_min_duration_statement=500"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    <<: *hardening
    cap_add: [SETUID, SETGID]   # the image entrypoint drops from root to the redis user
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    restart: "no"
    environment: *backend-env
    command: ["sh", "-c", "python -m app.db.migrate && python scripts/seed.py --if-empty"]
    volumes: ["./data:/app/data:ro"]
    networks: [internal]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  backend:
    <<: *hardening
    build: ./backend
    image: resolveiq-backend:${VERSION:-latest}
    environment: *backend-env
    volumes: ["./data:/app/data:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]
    extra_hosts: ["host.docker.internal:host-gateway"]
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources: {limits: {memory: 5g, cpus: "2.0"}}   # the severity/sentiment NLI model needs ~2.5 GB resident
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  worker:
    <<: *hardening
    build: ./backend
    image: resolveiq-backend:${VERSION:-latest}
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes: ["./data:/app/data:ro"]
    read_only: true
    tmpfs: ["/tmp"]
    networks: [internal]
    extra_hosts: ["host.docker.internal:host-gateway"]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources: {limits: {memory: 5g, cpus: "2.0"}}
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9100/metrics')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    <<: *hardening
    build: ./frontend
    read_only: true
    tmpfs: ["/tmp", "/etc/nginx/conf.d:uid=101,gid=101,mode=755"]   # nginx renders its config here at start
    networks: [internal]
    deploy:
      resources: {limits: {memory: 128m}}
    depends_on: [backend]

  proxy:
    <<: *hardening
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    image: caddy:2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      TLS_MODE: ${TLS_MODE:-internal}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks: [internal]
    depends_on: [frontend]

  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.0
    volumes:
      - ./infra/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    networks: [internal]
    profiles: ["monitoring"]

  grafana:
    <<: *hardening
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"]   # loopback only: reach it through an SSH tunnel or your VPN
    networks: [internal]
    depends_on: [prometheus]
    profiles: ["monitoring"]

  # Optional bundled LLM (CPU by default; add docker-compose.gpu.yml for NVIDIA GPUs). Without it, point OLLAMA_BASE_URL
  # at an existing Ollama / OpenAI-compatible server. Pull the model once: docker compose ... run --rm ollama-pull
  ollama:
    <<: *hardening
    cap_drop: []
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    networks: [internal]
    profiles: ["ollama"]
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    entrypoint: ["sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen3:4b-instruct}"]
    networks: [internal]
    depends_on: [ollama]
    profiles: ["ollama"]

networks:
  internal: {}

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
  caddy_data:
  caddy_config:
  ollama:
