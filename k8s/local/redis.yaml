# In-cluster Redis for the LOCAL cluster only (response/embedding cache and rate-limit counters; it holds no system of record,
# so it has no volume: a restart just means a cold cache). Production uses a managed Redis with a password and TLS.
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: resolveiq}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: resolveiq, labels: {app: redis}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["sh", "-c", "exec redis-server --requirepass \"$REDIS_PASSWORD\" --save '' --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru"]
          ports: [{containerPort: 6379, name: redis}]
          env:
            - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: resolveiq-redis, key: REDIS_PASSWORD}}}
            - {name: REDISCLI_AUTH, valueFrom: {secretKeyRef: {name: resolveiq-redis, key: REDIS_PASSWORD}}}
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {exec: {command: ["redis-cli", "ping"]}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 6}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 384Mi}}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
