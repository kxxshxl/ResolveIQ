#     --from-literal=DATABASE_URL='postgresql://resolveiq_app:<pw>@<pg-host>:5432/resolveiq' \
#     --from-literal=DATABASE_ADMIN_URL='postgresql://resolveiq_owner:<pw>@<pg-host>:5432/resolveiq' \
